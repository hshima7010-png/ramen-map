<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ - FUKUOKA RAMEN MAP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      font-family: 'Noto Sans JP', sans-serif;
      background: #f5f4f2;
      min-height: 100%;
    }

    /* ===== ヘッダー ===== */
    .header {
      background: #1a1a1a;
      border-bottom: 3px solid #c62d2d;
      padding: 0 20px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-title {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.15em;
    }
    .header-back {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
      letter-spacing: 0.05em;
      transition: color 0.2s;
    }
    .header-back:hover { color: #fff; }

    /* ===== コンテンツ ===== */
    .content {
      max-width: 480px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    /* ===== ページタイトル ===== */
    .page-title {
      margin-bottom: 28px;
    }
    .page-title h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .page-title p {
      font-size: 13px;
      color: #888;
      line-height: 1.7;
    }
    .page-title-line {
      width: 32px;
      height: 3px;
      background: #c62d2d;
      margin-top: 12px;
    }

    /* ===== フォームカード ===== */
    .form-card {
      background: #fff;
      border-radius: 12px;
      border: 0.5px solid #e8e8e8;
      overflow: hidden;
    }

    /* ===== フォームフィールド ===== */
    .form-body { padding: 24px; }
    .field { margin-bottom: 20px; }
    .field:last-of-type { margin-bottom: 0; }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #555;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    .field label .required {
      color: #c62d2d;
      margin-left: 4px;
      font-size: 10px;
    }

    .field input[type="text"],
    .field input[type="email"],
    .field textarea {
      width: 100%;
      padding: 10px 14px;
      border: 0.5px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Noto Sans JP', sans-serif;
      color: #1a1a1a;
      background: #fafafa;
      transition: border-color 0.2s, background 0.2s;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
    }
    .field input:focus,
    .field textarea:focus {
      border-color: #c62d2d;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(198,45,45,0.08);
    }
    .field textarea {
      height: 120px;
      resize: vertical;
      line-height: 1.7;
    }

    /* ===== 送信ボタン ===== */
    .form-footer {
      padding: 16px 24px;
      border-top: 0.5px solid #f0f0f0;
      background: #fafafa;
    }
    .submit-btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: #c62d2d;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      font-family: 'Noto Sans JP', sans-serif;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background 0.2s;
    }
    .submit-btn:hover { background: #a82424; }

    /* ===== 成功メッセージ ===== */
    #success-message {
      display: none;
      margin-top: 16px;
      padding: 14px 16px;
      background: #f0faf4;
      border: 0.5px solid #b8e0c8;
      border-radius: 8px;
      font-size: 13px;
      color: #2d7a4f;
      font-weight: 500;
      text-align: center;
    }

    @media screen and (max-width: 480px) {
      .content { padding: 24px 16px 48px; }
      .form-body { padding: 20px; }
      .form-footer { padding: 14px 20px; }
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header class="header">
    <div class="header-title">FUKUOKA RAMEN MAP</div>
    <a href="map.html" class="header-back">← マップへ</a>
  </header>

  <!-- コンテンツ -->
  <div class="content">

    <div class="page-title">
      <h1>お問い合わせ</h1>
      <p>ご意見・ご要望・お店の情報提供など<br>お気軽にどうぞ</p>
      <div class="page-title-line"></div>
    </div>

    <div class="form-card">
      <div class="form-body">
        <form id="contact-form" action="contact.php" method="post">

          <div class="field">
            <label for="name">お名前 <span class="required">必須</span></label>
            <input type="text" id="name" name="name" placeholder="山田 太郎" required>
          </div>

          <div class="field">
            <label for="email">メールアドレス <span class="required">必須</span></label>
            <input type="email" id="email" name="email" placeholder="example@email.com" required>
          </div>

          <div class="field">
            <label for="message">お問い合わせ内容 <span class="required">必須</span></label>
            <textarea id="message" name="message" placeholder="お問い合わせ内容をご記入ください" required></textarea>
          </div>

        </form>
      </div>

      <div class="form-footer">
        <button class="submit-btn" onclick="document.getElementById('contact-form').submit()">送信する</button>
      </div>
    </div>

    <div id="success-message">
      送信が完了しました。ありがとうございます。
    </div>

  </div>

  <script src="js/contact_form.js"></script>

</body>
</html>
